services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  relay:
    build:
      context: ../../
      dockerfile: examples/nip5-access/Dockerfile
    ports:
      - "${RELAY_PORT:-7447}:7447"
    environment:
      POSTGRESQL_DATABASE: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}"
      RELAY_URL: "${RELAY_URL}"
      ALLOWED_DOMAINS: "${ALLOWED_DOMAINS}"
      TEST_MODE: "${TEST_MODE:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:



